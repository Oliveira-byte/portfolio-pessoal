<div class="g-field{% if field.field.widget.input_type == 'checkbox' %} g-field-check{% endif %}{% if field.field.widget.input_type == 'hidden' %} g-hidden{% endif %}">{% if field.field.widget.input_type == 'checkbox' %}{{ field }}{{ field.label_tag }}{% else %}{{ field.label_tag }}{{ field }}{% endif %}{% if field.help_text %}<div class="g-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{% if field.errors %}<div class="g-errors" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}</div>
